<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JARVIS</title>
<style>
  :root {
    --bg: #141416;
    --surface: #1e1f23;
    --surface-hover: #282a30;
    --border: rgba(255, 255, 255, 0.08);
    --accent: #4d6bfe;
    --accent-soft: rgba(77, 107, 254, 0.16);
    --text: #ececf1;
    --muted: #8e8ea0;
    --user-bubble: #2b2d35;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--bg);
    z-index: 10;
  }
  .icon-btn {
    background: transparent;
    border: none;
    color: var(--text);
    width: 38px;
    height: 38px;
    border-radius: 10px;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:active {
    background: var(--surface);
  }
  .header-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .badge-online {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #10b981;
  }

  /* Drawer */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    z-index: 40;
    display: none;
  }
  .overlay.open {
    display: block;
  }
  .drawer {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 285px;
    max-width: 82vw;
    background: #18181b;
    border-right: 1px solid var(--border);
    z-index: 50;
    transform: translateX(-100%);
    transition: transform 0.22s ease;
    display: flex;
    flex-direction: column;
    padding: 14px;
  }
  .drawer.open {
    transform: translateX(0);
  }
  .drawer-top {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .search-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 9px 12px;
    color: var(--text);
    font-size: 13.5px;
    outline: none;
  }
  .new-btn-drawer {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 38px;
    height: 38px;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
  }
  .section-label {
    font-size: 11px;
    color: var(--muted);
    margin: 10px 4px 6px;
    font-weight: 600;
    letter-spacing: 0.4px;
  }
  .chat-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .chat-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 11px;
    border-radius: 10px;
    font-size: 13.5px;
    color: var(--text);
    cursor: pointer;
  }
  .chat-item.active {
    background: var(--surface);
    font-weight: 600;
  }
  .chat-title-text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding-right: 6px;
  }
  .chat-actions {
    display: flex;
    gap: 4px;
  }
  .mini-act {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 13px;
    padding: 3px 5px;
    cursor: pointer;
  }
  .drawer-footer {
    border-top: 1px solid var(--border);
    padding-top: 12px;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .profile-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .profile-ava {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #3b82f6;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .profile-name {
    font-size: 14px;
    font-weight: 600;
  }

  /* Main Chat */
  #chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .welcome-screen {
    margin: auto;
    text-align: center;
    max-width: 310px;
    padding: 16px;
  }
  .welcome-ava {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    margin: 0 auto 14px;
    overflow: hidden;
    border: 2px solid rgba(77, 107, 254, 0.5);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .welcome-ava img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    position: relative;
    z-index: 2;
  }
  .welcome-ava span {
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
    position: absolute;
    z-index: 1;
  }
  .welcome-screen h2 {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.35;
    color: #fff;
  }

  .msg-wrap {
    display: flex;
    flex-direction: column;
    max-width: 100%;
  }
  .msg-wrap.user {
    align-items: flex-end;
  }
  .msg-wrap.ai {
    align-items: flex-start;
  }
  .user-bubble {
    background: var(--user-bubble);
    color: #fff;
    padding: 11px 15px;
    border-radius: 18px;
    border-bottom-right-radius: 4px;
    font-size: 15px;
    line-height: 1.48;
    max-width: 85%;
    word-wrap: break-word;
  }
  .ai-row {
    display: flex;
    gap: 10px;
    width: 100%;
  }
  .ai-ava {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-top: 2px;
  }
  .ai-ava img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    position: relative;
    z-index: 2;
  }
  .ai-ava span {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    position: absolute;
    z-index: 1;
  }
  .ai-content {
    flex: 1;
    min-width: 0;
  }
  .ai-text {
    font-size: 15px;
    line-height: 1.58;
    color: var(--text);
    word-wrap: break-word;
  }
  .ai-text a {
    color: #60a5fa;
    text-decoration: underline;
  }
  .ai-text pre {
    background: #0d0e11;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    margin: 8px 0;
    overflow-x: auto;
    font-family: monospace;
    font-size: 12.5px;
    color: #a5d6ff;
  }
  .ai-text code {
    background: rgba(255, 255, 255, 0.08);
    padding: 2px 5px;
    border-radius: 5px;
    font-family: monospace;
    font-size: 13px;
  }
  .ai-text pre code {
    background: none;
    padding: 0;
  }
  .msg-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  .tool-icon {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 4px 9px;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .tool-icon:active {
    background: var(--surface);
    color: var(--text);
  }

  /* Bottom Capsule Input */
  .input-wrapper {
    padding: 8px 12px 12px;
    background: var(--bg);
  }
  .input-capsule {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 10px 12px 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  textarea {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 15px;
    resize: none;
    outline: none;
    min-height: 24px;
    max-height: 120px;
    line-height: 1.4;
  }
  textarea::placeholder {
    color: var(--muted);
  }
  .capsule-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .pills-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pill-btn {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 16px;
    padding: 5px 11px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .pill-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: #8ea4ff;
  }
  .send-circle {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .send-circle:disabled {
    background: #323540;
    color: #6b7280;
  }

  /* Settings Modal */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    z-index: 60;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal.open {
    display: flex;
  }
  .modal-card {
    background: #1e1f23;
    border: 1px solid var(--border);
    border-radius: 18px;
    width: 100%;
    max-width: 390px;
    padding: 18px;
    max-height: 85dvh;
    overflow-y: auto;
  }
  .modal-card h3 {
    font-size: 16px;
    margin-bottom: 14px;
    color: #fff;
  }
  .field {
    margin-bottom: 12px;
  }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    background: #141416;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 9px 11px;
    font-size: 13.5px;
  }
  .modal-btns {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .btn-sec {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-weight: 600;
  }
  .btn-pri {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }
</style>
</head>
<body>

<header>
  <button class="icon-btn" onclick="toggleDrawer()" title="История">☰</button>
  <div class="header-title">
    <span>JARVIS</span>
    <span class="badge-online"></span>
  </div>
  <button class="icon-btn" onclick="startFreshChat()" title="Новый чат">＋</button>
</header>

<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-top">
    <input type="text" class="search-input" id="chat-search" placeholder="Поиск чатов..." oninput="renderChatList()">
    <button class="new-btn-drawer" onclick="startFreshChat(true)">＋</button>
  </div>
  <div class="chat-list" id="chat-list"></div>
  <div class="drawer-footer">
    <div class="profile-info">
      <div class="profile-ava">M</div>
      <div class="profile-name">Matvey</div>
    </div>
    <button class="icon-btn" onclick="openSettings()">•••</button>
  </div>
</aside>

<main id="chat-box"></main>

<div class="input-wrapper">
  <div class="input-capsule">
    <textarea id="msg-input" rows="1" placeholder="Спросите Джарвиса..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <div class="capsule-bottom">
      <div class="pills-row">
        <button class="pill-btn" id="pill-reason" onclick="toggleReason()">⚛ Рассуждение</button>
        <button class="pill-btn active" id="pill-search" onclick="toggleSearch()">🌐 Поиск</button>
      </div>
      <button class="send-circle" id="send-btn" onclick="sendMessage()">↑</button>
    </div>
  </div>
</div>

<div class="modal" id="settings-modal">
  <div class="modal-card">
    <h3>Настройки ядра JARVIS</h3>
    <div class="field">
      <label>Базовая модель (когда выключено «Рассуждение»):</label>
      <select id="cfg-fast-model">
        <option value="@cf/meta/llama-3.1-8b-instruct-fast">⚡ Turbo 8B (Мгновенные ответы)</option>
        <option value="@cf/meta/llama-3.3-70b-instruct-fp8-fast">🧠 Pro 70B (Максимальный интеллект)</option>
        <option value="@cf/qwen/qwen2.5-coder-32b-instruct">💻 Coder 32B (Программирование)</option>
      </select>
    </div>
    <div class="field">
      <label>Адрес сервера (Cloudflare Worker):</label>
      <input type="text" id="cfg-url">
    </div>
    <div class="field">
      <label>Ключ доступа:</label>
      <input type="password" id="cfg-key">
    </div>
    <div class="field">
      <label>Характер, обращение «сэр» и режим РП:</label>
      <textarea id="cfg-prompt" rows="4"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn-sec" onclick="closeSettings()">Отмена</button>
      <button class="btn-pri" onclick="saveSettings()">Сохранить</button>
    </div>
  </div>
</div>

<script>
  const DEFAULT_PROMPT = "Ты — ДЖАРВИС (J.A.R.V.I.S.), высокоинтеллектуальный ИИ-ассистент с харизмой и живым умом. Твой создатель и архитектор — Матвей. К пользователю ты обращаешься «сэр» (или по любому имени и роли, которые пользователь задаст в чате). Если начинается ролевая игра (РП) или задаётся новый персонаж, ты мгновенно вживаешься в роль и отыгрываешь сюжет живо и увлекательно без занудства.";

  let config = JSON.parse(localStorage.getItem('jarvis_ds_cfg_v1')) || {
    url: 'https://jarvis-brain.trofimmatvey81.workers.dev',
    key: '123',
    fastModel: '@cf/meta/llama-3.1-8b-instruct-fast',
    prompt: DEFAULT_PROMPT
  };

  let chats = JSON.parse(localStorage.getItem('jarvis_ds_chats_v1')) || [];
  let activeChatId = null;
  let useReasoning = false;
  let useWebSearch = true;
  let isGenerating = false;

  function saveChats() {
    // Удаляем пустые несохранённые чаты перед записью
    const nonEmpty = chats.filter(c => c.messages.length > 0);
    localStorage.setItem('jarvis_ds_chats_v1', JSON.stringify(nonEmpty));
  }

  // При каждом запуске/открытии приложения всегда начинаем с чистого нового чата
  function startFreshChat(closeMenu = false) {
    const id = 'chat_' + Date.now();
    chats = chats.filter(c => c.messages.length > 0);
    chats.unshift({ id, title: 'Новый чат', pinned: false, messages: [] });
    activeChatId = id;
    renderChatList();
    renderMessages();
    if (closeMenu && document.getElementById('drawer').classList.contains('open')) {
      toggleDrawer();
    }
  }

  function toggleDrawer() {
    document.getElementById('drawer').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('open');
    renderChatList();
  }

  function toggleReason() {
    useReasoning = !useReasoning;
    document.getElementById('pill-reason').classList.toggle('active', useReasoning);
  }

  function toggleSearch() {
    useWebSearch = !useWebSearch;
    document.getElementById('pill-search').classList.toggle('active', useWebSearch);
  }

  function switchChat(id) {
    activeChatId = id;
    renderChatList();
    renderMessages();
    toggleDrawer();
  }

  function togglePin(e, id) {
    e.stopPropagation();
    const c = chats.find(x => x.id === id);
    if (c) {
      c.pinned = !c.pinned;
      saveChats();
      renderChatList();
    }
  }

  function deleteChat(e, id) {
    e.stopPropagation();
    chats = chats.filter(x => x.id !== id);
    saveChats();
    if (activeChatId === id) {
      startFreshChat(false);
    } else {
      renderChatList();
    }
  }

  function renderChatList() {
    const list = document.getElementById('chat-list');
    const q = (document.getElementById('chat-search').value || '').toLowerCase();
    list.innerHTML = '';

    const visible = chats.filter(c => c.messages.length > 0 && c.title.toLowerCase().includes(q));
    const pinned = visible.filter(c => c.pinned);
    const regular = visible.filter(c => !c.pinned);

    if (pinned.length > 0) {
      const lbl = document.createElement('div');
      lbl.className = 'section-label';
      lbl.textContent = 'Закреплено';
      list.appendChild(lbl);
      pinned.forEach(c => list.appendChild(buildChatRow(c)));
    }

    if (regular.length > 0) {
      const lbl = document.createElement('div');
      lbl.className = 'section-label';
      lbl.textContent = 'История';
      list.appendChild(lbl);
      regular.forEach(c => list.appendChild(buildChatRow(c)));
    }
  }

  function buildChatRow(c) {
    const div = document.createElement('div');
    div.className = 'chat-item' + (c.id === activeChatId ? ' active' : '');
    div.onclick = () => switchChat(c.id);
    div.innerHTML = `
      <span class="chat-title-text">${escapeHtml(c.title)}</span>
      <div class="chat-actions">
        <button class="mini-act" onclick="togglePin(event, '${c.id}')" title="Закрепить">${c.pinned ? '★' : '☆'}</button>
        <button class="mini-act" onclick="deleteChat(event, '${c.id}')" title="Удалить">✕</button>
      </div>`;
    return div;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }

  function formatMarkdown(text) {
    let safe = escapeHtml(text);
    safe = safe.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
    safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
    safe = safe.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    safe = safe.replace(/
/g, '<br>');
    return safe;
  }

  function copyReply(idx) {
    const chat = chats.find(c => c.id === activeChatId);
    if (!chat || !chat.messages[idx]) return;
    navigator.clipboard.writeText(chat.messages[idx].content);
  }

  function renderMessages() {
    const box = document.getElementById('chat-box');
    const chat = chats.find(c => c.id === activeChatId);
    if (!chat || chat.messages.length === 0) {
      box.innerHTML = `
        <div class="welcome-screen">
          <div class="welcome-ava">
            <img src="avatar.png" onerror="this.style.display='none'" alt="">
            <span>J</span>
          </div>
          <h2>Здравствуйте, сэр.<br>Чем могу помочь?</h2>
        </div>`;
      return;
    }

    box.innerHTML = '';
    chat.messages.forEach((m, idx) => {
      const wrap = document.createElement('div');
      wrap.className = 'msg-wrap ' + (m.role === 'user' ? 'user' : 'ai');
      if (m.role === 'user') {
        wrap.innerHTML = `<div class="user-bubble">${formatMarkdown(m.content)}</div>`;
      } else {
        const isLastAi = idx === chat.messages.length - 1;
        const regenBtn = isLastAi
          ? `<button class="tool-icon" onclick="regenerateLast()">↻ Заново</button>`
          : '';
        wrap.innerHTML = `
          <div class="ai-row">
            <div class="ai-ava">
              <img src="avatar.png" onerror="this.style.display='none'" alt="">
              <span>J</span>
            </div>
            <div class="ai-content">
              <div class="ai-text">${formatMarkdown(m.content)}</div>
              <div class="msg-toolbar">
                <button class="tool-icon" onclick="copyReply(${idx})">📋 Копия</button>
                ${regenBtn}
              </div>
            </div>
          </div>`;
      }
      box.appendChild(wrap);
    });
    box.scrollTop = box.scrollHeight;
  }

  async function regenerateLast() {
    if (isGenerating) return;
    const chat = chats.find(c => c.id === activeChatId);
    if (!chat || chat.messages.length === 0) return;

    // Удаляем последний ответ ИИ, если он есть
    if (chat.messages[chat.messages.length - 1].role === 'assistant') {
      chat.messages.pop();
    }
    if (chat.messages.length === 0) return;

    saveChats();
    renderMessages();
    await streamResponse(chat);
  }

  async function sendMessage() {
    if (isGenerating) return;
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;

    let chat = chats.find(c => c.id === activeChatId);
    if (!chat) {
      startFreshChat(false);
      chat = chats.find(c => c.id === activeChatId);
    }

    if (chat.messages.length === 0) {
      chat.title = text.slice(0, 34) + (text.length > 34 ? '...' : '');
    }

    chat.messages.push({ role: 'user', content: text });
    input.value = '';
    input.style.height = '24px';
    saveChats();
    renderChatList();
    renderMessages();

    await streamResponse(chat);
  }

  async function streamResponse(chat) {
    isGenerating = true;
    const btn = document.getElementById('send-btn');
    btn.disabled = true;

    const box = document.getElementById('chat-box');
    const tempWrap = document.createElement('div');
    tempWrap.className = 'msg-wrap ai';
    tempWrap.innerHTML = `
      <div class="ai-row">
        <div class="ai-ava">
          <img src="avatar.png" onerror="this.style.display='none'" alt="">
          <span>J</span>
        </div>
        <div class="ai-content">
          <div class="ai-text" style="color:var(--muted)">Думаю...</div>
        </div>
      </div>`;
    box.appendChild(tempWrap);
    const textEl = tempWrap.querySelector('.ai-text');
    box.scrollTop = box.scrollHeight;

    let fullReply = '';
    const chosenModel = useReasoning
      ? '@cf/meta/llama-3.3-70b-instruct-fp8-fast'
      : config.fastModel;

    try {
      const history = [{ role: 'system', content: config.prompt }, ...chat.messages.slice(-8)];
      const res = await fetch(config.url.trim(), {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + config.key.trim()
        },
        body: JSON.stringify({
          model: chosenModel,
          messages: history,
          stream: true,
          webSearch: useWebSearch
        })
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let lineBuffer = '';
      textEl.style.color = 'var(--text)';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        lineBuffer += decoder.decode(value, { stream: true });
        const lines = lineBuffer.split('
');
        lineBuffer = lines.pop() || '';

        for (const line of lines) {
          const trimmed = line.trim();
          if (trimmed.startsWith('data: ') && trimmed !== 'data: [DONE]') {
            try {
              const data = JSON.parse(trimmed.slice(6));
              if (data.response) {
                fullReply += data.response;
                textEl.innerHTML = formatMarkdown(fullReply);
                box.scrollTop = box.scrollHeight;
              }
            } catch (e) {}
          }
        }
      }

      if (lineBuffer.trim().startsWith('data: ') && lineBuffer.trim() !== 'data: [DONE]') {
        try {
          const data = JSON.parse(lineBuffer.trim().slice(6));
          if (data.response) fullReply += data.response;
        } catch (e) {}
      }

      if (!fullReply) {
        fullReply = 'Связь установлена, сэр, но ответ пришёл пустым. Попробуйте нажать «↻ Заново».';
      }
      chat.messages.push({ role: 'assistant', content: fullReply });
    } catch (err) {
      chat.messages.push({ role: 'assistant', content: 'Ошибка связи с сервером, сэр: ' + err.message });
    }

    isGenerating = false;
    btn.disabled = false;
    saveChats();
    renderMessages();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = '24px';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function openSettings() {
    document.getElementById('cfg-fast-model').value = config.fastModel;
    document.getElementById('cfg-url').value = config.url;
    document.getElementById('cfg-key').value = config.key;
    document.getElementById('cfg-prompt').value = config.prompt;
    document.getElementById('settings-modal').classList.add('open');
  }

  function closeSettings() {
    document.getElementById('settings-modal').classList.remove('open');
  }

  function saveSettings() {
    config.fastModel = document.getElementById('cfg-fast-model').value;
    config.url = document.getElementById('cfg-url').value.trim();
    config.key = document.getElementById('cfg-key').value.trim();
    config.prompt = document.getElementById('cfg-prompt').value.trim() || DEFAULT_PROMPT;
    localStorage.setItem('jarvis_ds_cfg_v1', JSON.stringify(config));
    closeSettings();
  }

  // Старт всегда с чистого нового чата, старые чаты сохранены в боковом меню
  startFreshChat(false);
</script>
</body>
