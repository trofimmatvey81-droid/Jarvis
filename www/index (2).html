<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JARVIS AI</title>
<style>
  :root {
    --bg: #141416;
    --sidebar: #1c1c1f;
    --surface: #232327;
    --surface-hover: #2c2c31;
    --border: rgba(255, 255, 255, 0.08);
    --text: #ececf1;
    --muted: #8e8ea0;
    --blue: #4d6bfe;
    --blue-bg: rgba(77, 107, 254, 0.16);
    --blue-border: rgba(77, 107, 254, 0.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--bg); z-index: 10; flex-shrink: 0;
  }
  .icon-btn {
    background: none; border: none; color: var(--text); width: 38px; height: 38px;
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 20px;
  }
  .icon-btn:active { background: var(--surface); }
  .top-title { font-size: 15px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; }
  .top-badge { font-size: 11px; color: var(--muted); background: var(--surface); padding: 2px 8px; border-radius: 99px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); z-index: 40;
    display: none; opacity: 0; transition: opacity 0.2s;
  }
  .overlay.open { display: block; opacity: 1; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: 290px; max-width: 82vw;
    background: var(--sidebar); z-index: 50; transform: translateX(-100%);
    transition: transform 0.25s ease; display: flex; flex-direction: column;
    border-right: 1px solid var(--border);
  }
  .sidebar.open { transform: translateX(0); }
  .sb-top { padding: 14px; display: flex; gap: 8px; align-items: center; }
  .search-box {
    flex: 1; background: var(--surface); border-radius: 12px; padding: 9px 12px;
    display: flex; align-items: center; gap: 8px; border: 1px solid var(--border);
  }
  .search-box input { background: none; border: none; color: var(--text); font-size: 14px; width: 100%; outline: none; }
  .new-btn-sb {
    width: 38px; height: 38px; border-radius: 12px; background: var(--surface);
    border: 1px solid var(--border); color: var(--text); font-size: 18px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .sb-scroll { flex: 1; overflow-y: auto; padding: 0 10px 12px; }
  .sb-section { font-size: 11px; font-weight: 600; color: var(--muted); padding: 12px 10px 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .chat-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-radius: 12px; cursor: pointer; margin-bottom: 2px;
  }
  .chat-row.active { background: var(--surface); }
  .chat-row-title { font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; padding-right: 6px; }
  .row-actions { display: flex; gap: 4px; }
  .mini-act { background: none; border: none; color: var(--muted); font-size: 13px; padding: 4px; cursor: pointer; }
  .sb-footer {
    padding: 12px 14px; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .user-pill { display: flex; align-items: center; gap: 10px; }
  .user-circle {
    width: 32px; height: 32px; border-radius: 50%; background: var(--blue);
    color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center;
  }

  #chat-box { flex: 1; overflow-y: auto; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 18px; }
  .welcome {
    margin: auto; text-align: center; max-width: 310px; padding: 20px 10px;
    display: flex; flex-direction: column; align-items: center;
  }
  .welcome-ava {
    width: 72px; height: 72px; border-radius: 50%; overflow: hidden; margin-bottom: 16px;
    background: var(--blue-bg); border: 2px solid var(--blue-border);
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .welcome-ava img { width: 100%; height: 100%; object-fit: cover; object-position: top center; position: relative; z-index: 2; }
  .welcome-ava span { font-size: 28px; font-weight: 800; color: var(--blue); position: absolute; z-index: 1; }
  .welcome h2 { font-size: 20px; font-weight: 600; color: var(--text); line-height: 1.35; }

  .msg-user {
    align-self: flex-end; background: var(--surface); color: var(--text);
    padding: 11px 16px; border-radius: 20px; border-bottom-right-radius: 6px;
    max-width: 84%; font-size: 15px; line-height: 1.45; word-wrap: break-word;
  }
  .msg-ai-wrap { display: flex; gap: 10px; align-items: flex-start; max-width: 96%; }
  .ai-ava {
    width: 28px; height: 28px; border-radius: 50%; overflow: hidden; flex-shrink: 0; margin-top: 2px;
    background: var(--blue-bg); border: 1px solid var(--blue-border);
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .ai-ava img { width: 100%; height: 100%; object-fit: cover; object-position: top center; position: relative; z-index: 2; }
  .ai-ava span { font-size: 12px; font-weight: 700; color: var(--blue); position: absolute; z-index: 1; }
  .ai-body { flex: 1; min-width: 0; }
  .ai-text { font-size: 15px; line-height: 1.55; color: var(--text); word-wrap: break-word; }
  .ai-text a { color: #6ea8fe; text-decoration: underline; }
  .ai-text pre {
    background: #0d0d0f; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; margin: 8px 0; overflow-x: auto; font-family: monospace; font-size: 13px; color: #a5d6ff;
  }
  .ai-text code { background: var(--surface); padding: 2px 5px; border-radius: 5px; font-family: monospace; font-size: 13.5px; }
  .ai-text pre code { background: none; padding: 0; }
  .ai-tools { display: flex; gap: 12px; margin-top: 8px; }
  .tool-link {
    background: none; border: none; color: var(--muted); font-size: 12.5px;
    display: flex; align-items: center; gap: 4px; cursor: pointer; padding: 4px 0;
  }
  .tool-link:active { color: var(--text); }

  .composer-wrap { padding: 8px 12px 14px; background: var(--bg); flex-shrink: 0; }
  .composer-box {
    background: var(--surface); border-radius: 24px; padding: 12px 14px 10px;
    border: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px;
  }
  textarea {
    width: 100%; background: none; border: none; color: var(--text); font-size: 15.5px;
    resize: none; max-height: 120px; min-height: 24px; outline: none; line-height: 1.4;
  }
  textarea::placeholder { color: var(--muted); }
  .composer-bottom { display: flex; align-items: center; justify-content: space-between; }
  .pills { display: flex; gap: 8px; }
  .pill {
    padding: 6px 12px; border-radius: 99px; font-size: 13px; font-weight: 500;
    border: 1px solid var(--border); background: transparent; color: var(--text);
    display: flex; align-items: center; gap: 5px; cursor: pointer;
  }
  .pill.active { background: var(--blue-bg); border-color: var(--blue-border); color: #8ab4f8; }
  .send-circle {
    width: 34px; height: 34px; border-radius: 50%; border: none;
    background: var(--blue); color: #fff; font-size: 17px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .send-circle:disabled { background: #383842; color: #6e6e80; }

  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 60;
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .modal.open { display: flex; }
  .modal-card {
    background: var(--sidebar); border: 1px solid var(--border); border-radius: 20px;
    width: 100%; max-width: 380px; padding: 18px; max-height: 85vh; overflow-y: auto;
  }
  .modal-card h3 { font-size: 16px; margin-bottom: 14px; color: var(--text); }
  .fld { margin-bottom: 12px; }
  .fld label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .fld input, .fld textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text); padding: 10px; font-size: 14px; outline: none;
  }
  .m-btns { display: flex; gap: 10px; margin-top: 14px; }
  .m-btn { flex: 1; padding: 11px; border-radius: 12px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; }
  .m-cancel { background: var(--surface); color: var(--muted); }
  .m-save { background: var(--blue); color: #fff; }
</style>
</head>
<body>

<header>
  <button class="icon-btn" id="btn-menu" type="button">☰</button>
  <div class="top-title">JARVIS <span class="top-badge" id="mode-badge">Turbo 8B</span></div>
  <button class="icon-btn" id="btn-new-top" type="button">＋</button>
</header>

<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sb-top">
    <div class="search-box">
      <span style="color:var(--muted);font-size:14px;">🔍</span>
      <input type="text" id="sb-search" placeholder="Поиск по чатам">
    </div>
    <button class="new-btn-sb" id="btn-new-sb" type="button">＋</button>
  </div>
  <div class="sb-scroll" id="sb-list"></div>
  <div class="sb-footer">
    <div class="user-pill">
      <div class="user-circle">M</div>
      <span style="font-size:14px;font-weight:500;">Matvey</span>
    </div>
    <button class="icon-btn" id="btn-settings" type="button">⚙</button>
  </div>
</aside>

<main id="chat-box"></main>

<div class="composer-wrap">
  <div class="composer-box">
    <textarea id="msg-input" rows="1" placeholder="Напишите Джарвису..."></textarea>
    <div class="composer-bottom">
      <div class="pills">
        <button class="pill" id="pill-think" type="button">⚛ Рассуждение</button>
        <button class="pill active" id="pill-search" type="button">🌐 Поиск</button>
      </div>
      <button class="send-circle" id="btn-send" type="button">↑</button>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <h3>Настройки JARVIS</h3>
    <div class="fld">
      <label>Адрес сервера (Cloudflare Worker)</label>
      <input type="text" id="cfg-url">
    </div>
    <div class="fld">
      <label>Ключ доступа</label>
      <input type="password" id="cfg-key">
    </div>
    <div class="fld">
      <label>Характер и роль (системный промпт)</label>
      <textarea id="cfg-prompt" rows="4"></textarea>
    </div>
    <div class="m-btns">
      <button class="m-btn m-cancel" id="btn-close-cfg" type="button">Отмена</button>
      <button class="m-btn m-save" id="btn-save-cfg" type="button">Сохранить</button>
    </div>
  </div>
</div>

<script>
(function() {
  var DEFAULT_PROMPT = "Ты — ДЖАРВИС (J.A.R.V.I.S.), высокоинтеллектуальный ИИ-ассистент с харизмой и лёгкой британской иронией. Твой создатель — Матвей. К пользователю обращайся «сэр» (или по любому имени и роли, заданным в чате). В ролевой игре (РП) мгновенно вживайся в роль и отыгрывай сюжет живо и без занудства.";

  var cfg = {
    url: "https://jarvis-brain.trofimmatvey81.workers.dev",
    key: "123",
    prompt: DEFAULT_PROMPT
  };
  try {
    var savedCfg = JSON.parse(localStorage.getItem("jarvis_ds_cfg"));
    if (savedCfg && savedCfg.url) cfg = savedCfg;
  } catch (e) {}

  var chats = [];
  try {
    var savedChats = JSON.parse(localStorage.getItem("jarvis_ds_chats"));
    if (Array.isArray(savedChats)) chats = savedChats;
  } catch (e) {}

  var thinkMode = false;
  var searchMode = true;
  var isGenerating = false;

  // При каждом открытии приложения стартуем с чистого нового чата
  var activeId = "chat_" + Date.now();
  chats.unshift({ id: activeId, title: "Новый чат", pinned: false, messages: [] });

  function persist() {
    try {
      var nonEmpty = chats.filter(function(c) { return c.messages.length > 0 || c.id === activeId; });
      localStorage.setItem("jarvis_ds_chats", JSON.stringify(nonEmpty));
    } catch (e) {}
  }

  function getActiveChat() {
    for (var i = 0; i < chats.length; i++) {
      if (chats[i].id === activeId) return chats[i];
    }
    var fresh = { id: "chat_" + Date.now(), title: "Новый чат", pinned: false, messages: [] };
    chats.unshift(fresh);
    activeId = fresh.id;
    return fresh;
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderMarkdown(text) {
    var s = esc(text);
    s = s.replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>");
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, "<a href=\"$2\" target=\"_blank\">$1</a>");
    s = s.replace(/\n/g, "<br>");
    return s;
  }

  function toggleSidebar(force) {
    var sb = document.getElementById("sidebar");
    var ov = document.getElementById("overlay");
    var open = typeof force === "boolean" ? force : !sb.classList.contains("open");
    if (open) {
      sb.classList.add("open");
      ov.classList.add("open");
      renderSidebar();
    } else {
      sb.classList.remove("open");
      ov.classList.remove("open");
    }
  }

  function startNewChat() {
    var existingEmpty = null;
    for (var i = 0; i < chats.length; i++) {
      if (chats[i].messages.length === 0) { existingEmpty = chats[i]; break; }
    }
    if (existingEmpty) {
      activeId = existingEmpty.id;
    } else {
      var id = "chat_" + Date.now();
      chats.unshift({ id: id, title: "Новый чат", pinned: false, messages: [] });
      activeId = id;
    }
    persist();
    renderChat();
    toggleSidebar(false);
  }

  function renderSidebar() {
    var list = document.getElementById("sb-list");
    var query = (document.getElementById("sb-search").value || "").toLowerCase().trim();
    list.innerHTML = "";

    var filtered = chats.filter(function(c) {
      if (c.messages.length === 0 && c.id !== activeId) return false;
      if (!query) return true;
      return c.title.toLowerCase().indexOf(query) !== -1;
    });

    var pinned = filtered.filter(function(c) { return c.pinned; });
    var regular = filtered.filter(function(c) { return !c.pinned; });

    function appendGroup(label, items) {
      if (!items.length) return;
      var sec = document.createElement("div");
      sec.className = "sb-section";
      sec.textContent = label;
      list.appendChild(sec);

      items.forEach(function(c) {
        var row = document.createElement("div");
        row.className = "chat-row" + (c.id === activeId ? " active" : "");

        var titleSpan = document.createElement("span");
        titleSpan.className = "chat-row-title";
        titleSpan.textContent = c.title;
        titleSpan.onclick = function() {
          activeId = c.id;
          renderChat();
          toggleSidebar(false);
        };

        var acts = document.createElement("div");
        acts.className = "row-actions";

        var pinBtn = document.createElement("button");
        pinBtn.className = "mini-act";
        pinBtn.type = "button";
        pinBtn.textContent = c.pinned ? "★" : "☆";
        pinBtn.onclick = function(e) {
          e.stopPropagation();
          c.pinned = !c.pinned;
          persist();
          renderSidebar();
        };

        var delBtn = document.createElement("button");
        delBtn.className = "mini-act";
        delBtn.type = "button";
        delBtn.textContent = "✕";
        delBtn.onclick = function(e) {
          e.stopPropagation();
          chats = chats.filter(function(item) { return item.id !== c.id; });
          if (activeId === c.id) startNewChat();
          else { persist(); renderSidebar(); }
        };

        acts.appendChild(pinBtn);
        acts.appendChild(delBtn);
        row.appendChild(titleSpan);
        row.appendChild(acts);
        list.appendChild(row);
      });
    }

    appendGroup("Закреплено", pinned);
    appendGroup("История", regular);
  }

  function renderChat() {
    var box = document.getElementById("chat-box");
    var chat = getActiveChat();
    box.innerHTML = "";

    if (!chat.messages.length) {
      box.innerHTML =
        "<div class=\"welcome\">" +
          "<div class=\"welcome-ava\">" +
            "<img src=\"avatar.png\" onerror=\"this.style.display='none'\" alt=\"\">" +
            "<span>J</span>" +
          "</div>" +
          "<h2>Здравствуйте, сэр.<br>Чем могу помочь?</h2>" +
        "</div>";
      return;
    }

    for (var i = 0; i < chat.messages.length; i++) {
      var m = chat.messages[i];
      if (m.role === "user") {
        var uDiv = document.createElement("div");
        uDiv.className = "msg-user";
        uDiv.innerHTML = renderMarkdown(m.content);
        box.appendChild(uDiv);
      } else {
        var wrap = document.createElement("div");
        wrap.className = "msg-ai-wrap";

        var ava = document.createElement("div");
        ava.className = "ai-ava";
        ava.innerHTML = "<img src=\"avatar.png\" onerror=\"this.style.display='none'\" alt=\"\"><span>J</span>";

        var body = document.createElement("div");
        body.className = "ai-body";

        var txt = document.createElement("div");
        txt.className = "ai-text";
        txt.innerHTML = renderMarkdown(m.content);
        body.appendChild(txt);

        var tools = document.createElement("div");
        tools.className = "ai-tools";

        var copyBtn = document.createElement("button");
        copyBtn.className = "tool-link";
        copyBtn.type = "button";
        copyBtn.textContent = "📋 Копировать";
        (function(contentRef, btnRef) {
          btnRef.onclick = function() {
            if (navigator.clipboard) navigator.clipboard.writeText(contentRef);
            btnRef.textContent = "✔ Скопировано";
            setTimeout(function() { btnRef.textContent = "📋 Копировать"; }, 1500);
          };
        })(m.content, copyBtn);
        tools.appendChild(copyBtn);

        if (i === chat.messages.length - 1 && !isGenerating) {
          var regenBtn = document.createElement("button");
          regenBtn.className = "tool-link";
          regenBtn.type = "button";
          regenBtn.textContent = "↻ Заново";
          regenBtn.onclick = function() {
            regenerateLast();
          };
          tools.appendChild(regenBtn);
        }

        body.appendChild(tools);
        wrap.appendChild(ava);
        wrap.appendChild(body);
        box.appendChild(wrap);
      }
    }
    box.scrollTop = box.scrollHeight;
  }

  function regenerateLast() {
    if (isGenerating) return;
    var chat = getActiveChat();
    if (!chat.messages.length) return;
    if (chat.messages[chat.messages.length - 1].role === "assistant") {
      chat.messages.pop();
    }
    if (!chat.messages.length) return;
    runStream(chat);
  }

  function sendMessage() {
    if (isGenerating) return;
    var input = document.getElementById("msg-input");
    var text = input.value.trim();
    if (!text) return;

    var chat = getActiveChat();
    if (chat.messages.length === 0) {
      chat.title = text.slice(0, 30) + (text.length > 30 ? "..." : "");
    }

    chat.messages.push({ role: "user", content: text });
    input.value = "";
    input.style.height = "24px";
    persist();
    runStream(chat);
  }

  async function runStream(chat) {
    isGenerating = true;
    document.getElementById("btn-send").disabled = true;
    renderChat();

    var box = document.getElementById("chat-box");
    var wrap = document.createElement("div");
    wrap.className = "msg-ai-wrap";
    wrap.innerHTML =
      "<div class=\"ai-ava\"><img src=\"avatar.png\" onerror=\"this.style.display='none'\"><span>J</span></div>" +
      "<div class=\"ai-body\"><div class=\"ai-text\" style=\"color:var(--muted)\">Думаю...</div></div>";
    box.appendChild(wrap);
    var txtEl = wrap.querySelector(".ai-text");
    box.scrollTop = box.scrollHeight;

    var fullReply = "";
    var modelName = thinkMode ? "@cf/meta/llama-3.3-70b-instruct-fp8-fast" : "@cf/meta/llama-3.1-8b-instruct-fast";

    try {
      var history = [{ role: "system", content: cfg.prompt }].concat(chat.messages.slice(-8));
      var res = await fetch(cfg.url.trim(), {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + cfg.key.trim()
        },
        body: JSON.stringify({
          model: modelName,
          messages: history,
          webSearch: searchMode,
          stream: true
        })
      });

      if (!res.ok) throw new Error("HTTP " + res.status);

      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var lineBuffer = "";
      txtEl.style.color = "var(--text)";

      while (true) {
        var chunkObj = await reader.read();
        if (chunkObj.done) break;
        lineBuffer += decoder.decode(chunkObj.value, { stream: true });
        var lines = lineBuffer.split("\n");
        lineBuffer = lines.pop() || "";

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (line.indexOf("data: ") === 0 && line !== "data: [DONE]") {
            try {
              var parsed = JSON.parse(line.slice(6));
              if (parsed.response) {
                fullReply += parsed.response;
                txtEl.innerHTML = renderMarkdown(fullReply);
                box.scrollTop = box.scrollHeight;
              }
            } catch (e) {}
          }
        }
      }

      if (!fullReply.trim()) {
        fullReply = "Ответ получен, сэр, но сервер вернул пустой поток.";
      }
      chat.messages.push({ role: "assistant", content: fullReply });
    } catch (err) {
      chat.messages.push({ role: "assistant", content: "Ошибка связи с сервером, сэр: " + err.message });
    }

    isGenerating = false;
    document.getElementById("btn-send").disabled = false;
    persist();
    renderChat();
  }

  // Привязка всех кнопок
  document.getElementById("btn-menu").onclick = function() { toggleSidebar(true); };
  document.getElementById("overlay").onclick = function() { toggleSidebar(false); };
  document.getElementById("btn-new-top").onclick = startNewChat;
  document.getElementById("btn-new-sb").onclick = startNewChat;
  document.getElementById("sb-search").oninput = renderSidebar;
  document.getElementById("btn-send").onclick = sendMessage;

  var msgInput = document.getElementById("msg-input");
  msgInput.oninput = function() {
    this.style.height = "24px";
    this.style.height = Math.min(this.scrollHeight, 120) + "px";
  };
  msgInput.onkeydown = function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  };

  var pillThink = document.getElementById("pill-think");
  var modeBadge = document.getElementById("mode-badge");
  pillThink.onclick = function() {
    thinkMode = !thinkMode;
    if (thinkMode) {
      pillThink.classList.add("active");
      modeBadge.textContent = "Pro 70B";
    } else {
      pillThink.classList.remove("active");
      modeBadge.textContent = "Turbo 8B";
    }
  };

  var pillSearch = document.getElementById("pill-search");
  pillSearch.onclick = function() {
    searchMode = !searchMode;
    if (searchMode) pillSearch.classList.add("active");
    else pillSearch.classList.remove("active");
  };

  var modal = document.getElementById("modal");
  document.getElementById("btn-settings").onclick = function() {
    document.getElementById("cfg-url").value = cfg.url;
    document.getElementById("cfg-key").value = cfg.key;
    document.getElementById("cfg-prompt").value = cfg.prompt;
    modal.classList.add("open");
  };
  document.getElementById("btn-close-cfg").onclick = function() {
    modal.classList.remove("open");
  };
  document.getElementById("btn-save-cfg").onclick = function() {
    cfg.url = document.getElementById("cfg-url").value.trim() || cfg.url;
    cfg.key = document.getElementById("cfg-key").value.trim() || "123";
    cfg.prompt = document.getElementById("cfg-prompt").value.trim() || DEFAULT_PROMPT;
    try { localStorage.setItem("jarvis_ds_cfg", JSON.stringify(cfg)); } catch (e) {}
    modal.classList.remove("open");
  };

  renderChat();
})();
</script>
</body>
</html>
