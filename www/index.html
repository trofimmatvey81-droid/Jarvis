<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JARVIS AI</title>
<style>
  :root {
    --bg: #141416;
    --sidebar: #1c1c1f;
    --surface: #232327;
    --surface-hover: #2c2c31;
    --border: rgba(255, 255, 255, 0.08);
    --text: #ececf1;
    --muted: #8e8ea0;
    --blue: #4d6bfe;
    --blue-bg: rgba(77, 107, 254, 0.16);
    --blue-border: rgba(77, 107, 254, 0.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  header {
    height: 54px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between;
    background: var(--bg); flex-shrink: 0; z-index: 10;
  }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px; border: none; background: transparent;
    color: var(--text); font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn:active { background: var(--surface); }
  .header-title { font-size: 16px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; }
  .model-badge { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--surface); color: var(--muted); font-weight: 500; }

  /* Боковая шторка как в DeepSeek */
  .overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 40;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0; width: 280px; background: var(--sidebar);
    z-index: 50; transform: translateX(-100%); transition: transform 0.22s ease;
    display: flex; flex-direction: column; padding: 14px; border-right: 1px solid var(--border);
  }
  .drawer.open { transform: translateX(0); }
  .search-box {
    display: flex; align-items: center; background: var(--surface); border-radius: 20px;
    padding: 0 12px; height: 38px; margin-bottom: 12px; border: 1px solid var(--border);
  }
  .search-box input {
    background: transparent; border: none; color: var(--text); font-size: 14px; width: 100%; outline: none; margin-left: 8px;
  }
  .new-chat-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px;
    background: var(--blue-bg); border: 1px solid var(--blue-border); color: #8da2fb;
    font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 14px;
  }
  .section-label { font-size: 12px; color: var(--muted); padding: 4px 8px; margin-top: 4px; }
  .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .chat-item {
    display: flex; align-items: center; justify-content: space-between; padding: 10px;
    border-radius: 10px; font-size: 14px; color: var(--text); cursor: pointer;
  }
  .chat-item.active { background: var(--surface); font-weight: 500; }
  .chat-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .chat-actions { display: flex; gap: 4px; opacity: 0.75; }
  .mini-act { background: none; border: none; color: var(--muted); font-size: 13px; padding: 4px; cursor: pointer; }
  .drawer-footer {
    border-top: 1px solid var(--border); padding-top: 12px; margin-top: 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .user-profile { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; }
  .user-ava {
    width: 32px; height: 32px; border-radius: 50%; background: var(--blue);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
  }

  /* Экран чата */
  main { flex: 1; overflow-y: auto; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 18px; }
  .welcome {
    margin: auto; text-align: center; max-width: 310px; display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .welcome-ava {
    width: 68px; height: 68px; border-radius: 22px; background: var(--surface); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .welcome-ava img { width: 100%; height: 100%; object-fit: cover; }
  .welcome-ava span { font-size: 30px; font-weight: 700; color: var(--blue); }
  .welcome h2 { font-size: 21px; font-weight: 600; line-height: 1.3; }
  .welcome p { font-size: 13px; color: var(--muted); line-height: 1.45; }

  .msg { display: flex; flex-direction: column; gap: 6px; max-width: 100%; }
  .msg.user { align-items: flex-end; }
  .msg.user .bubble {
    background: var(--surface); color: var(--text); padding: 11px 15px;
    border-radius: 18px 18px 4px 18px; max-width: 85%; font-size: 15px; line-height: 1.45; word-break: break-word;
  }
  .msg.ai { align-items: flex-start; }
  .ai-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .ai-mini-ava {
    width: 24px; height: 24px; border-radius: 8px; background: var(--surface); overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .ai-mini-ava img { width: 100%; height: 100%; object-fit: cover; }
  .ai-mini-ava span { font-size: 12px; color: var(--blue); font-weight: 700; }
  .msg.ai .bubble {
    background: transparent; color: var(--text); font-size: 15px; line-height: 1.55;
    padding: 2px 0 2px 32px; width: 100%; word-break: break-word;
  }
  .msg.ai .bubble a { color: #7aa2f7; text-decoration: underline; }
  .msg.ai .bubble pre { background: #0d0d0f; padding: 10px; border-radius: 10px; overflow-x: auto; margin: 8px 0; border: 1px solid var(--border); }
  .msg.ai .bubble code { font-family: monospace; font-size: 13px; }

  .ai-toolbar { padding-left: 32px; display: flex; gap: 8px; margin-top: 2px; }
  .tool-chip {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-size: 12px; padding: 4px 10px; border-radius: 14px; cursor: pointer; display: flex; align-items: center; gap: 4px;
  }
  .tool-chip:active { background: var(--surface); color: var(--text); }

  .typing-dots { display: inline-flex; gap: 4px; align-items: center; padding: 6px 0; }
  .typing-dots i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--blue); animation: pulse 1.2s infinite ease-in-out;
  }
  .typing-dots i:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1.1); } }

  /* Капсула ввода как в DeepSeek */
  .composer-wrap { padding: 8px 12px 14px; background: var(--bg); flex-shrink: 0; }
  .composer {
    background: var(--surface); border: 1px solid var(--border); border-radius: 22px;
    padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 8px;
  }
  .composer textarea {
    background: transparent; border: none; color: var(--text); font-size: 15px; line-height: 1.4;
    resize: none; outline: none; max-height: 120px; min-height: 24px; width: 100%;
  }
  .composer-bar { display: flex; align-items: center; justify-content: space-between; }
  .pills { display: flex; gap: 6px; }
  .pill {
    height: 30px; padding: 0 11px; border-radius: 15px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 12px; font-weight: 500;
    display: flex; align-items: center; gap: 5px; cursor: pointer;
  }
  .pill.active { background: var(--blue-bg); border-color: var(--blue-border); color: #8da2fb; }
  .send-btn {
    width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--blue);
    color: #fff; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .send-btn:disabled { opacity: 0.4; }

  /* Модальное окно настроек */
  .modal {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.72); z-index: 60;
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .modal.open { display: flex; }
  .modal-card {
    background: var(--sidebar); border: 1px solid var(--border); border-radius: 18px;
    width: 100%; max-width: 380px; padding: 18px; display: flex; flex-direction: column; gap: 12px;
    max-height: 86dvh; overflow-y: auto;
  }
  .modal-card h3 { font-size: 17px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input, .field select, .field textarea {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 11px; color: var(--text); font-size: 14px; outline: none;
  }
  .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .btn-sec { background: var(--surface); color: var(--text); border: none; padding: 9px 14px; border-radius: 10px; font-size: 14px; }
  .btn-pri { background: var(--blue); color: #fff; border: none; padding: 9px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; }
</style>
</head>
<body>

<header>
  <button class="icon-btn" id="btn-menu" type="button" title="Чаты">☰</button>
  <div class="header-title">JARVIS <span class="model-badge" id="badge-mode">Turbo 8B</span></div>
  <button class="icon-btn" id="btn-new-top" type="button" title="Новый чат">＋</button>
</header>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="chat-search" placeholder="Поиск по чатам">
  </div>
  <div class="new-chat-row" id="btn-new-side">
    <span>💬</span> <span>Новый чат</span>
  </div>
  <div class="section-label" id="lbl-pinned" style="display:none;">Закреплено</div>
  <div class="chat-list" id="pinned-list" style="flex:none; max-height:35%;"></div>
  <div class="section-label">История чатов</div>
  <div class="chat-list" id="chat-list"></div>
  <div class="drawer-footer">
    <div class="user-profile">
      <div class="user-ava">M</div>
      <span>Matvey</span>
    </div>
    <button class="icon-btn" id="btn-settings" type="button" title="Настройки">⚙</button>
  </div>
</aside>

<main id="chat-box"></main>

<div class="composer-wrap">
  <div class="composer">
    <textarea id="msg-input" rows="1" placeholder="Написать Джарвису..."></textarea>
    <div class="composer-bar">
      <div class="pills">
        <button class="pill" id="pill-think" type="button">⚛ Рассуждение</button>
        <button class="pill" id="pill-web" type="button">🌐 Поиск</button>
      </div>
      <button class="send-btn" id="btn-send" type="button">↑</button>
    </div>
  </div>
</div>

<div class="modal" id="modal-settings">
  <div class="modal-card">
    <h3>Настройки JARVIS</h3>
    <div class="field">
      <label>Адрес сервера (Cloudflare Worker):</label>
      <input type="text" id="cfg-url">
    </div>
    <div class="field">
      <label>Ключ доступа:</label>
      <input type="password" id="cfg-key">
    </div>
    <div class="field">
      <label>Модель по умолчанию (когда выключено Рассуждение):</label>
      <select id="cfg-fast-model">
        <option value="@cf/meta/llama-3.1-8b-instruct-fast">⚡ Turbo 8B (Мгновенный ответ)</option>
        <option value="@cf/meta/llama-3.3-70b-instruct-fp8-fast">🧠 Pro 70B (Максимум интеллекта)</option>
        <option value="@cf/qwen/qwen2.5-coder-32b-instruct">💻 Coder 32B (Код и логика)</option>
      </select>
    </div>
    <div class="field">
      <label>Характер и стиль Джарвиса:</label>
      <textarea id="cfg-prompt" rows="4"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn-sec" id="btn-cfg-cancel" type="button">Отмена</button>
      <button class="btn-pri" id="btn-cfg-save" type="button">Сохранить</button>
    </div>
  </div>
</div>

<script>
  const DEFAULT_PROMPT = "Ты — ДЖАРВИС (J.A.R.V.I.S.), высокоинтеллектуальный ИИ-ассистент с харизмой, лёгкой британской иронией и живым характером. Твой создатель и архитектор — Матвей. К пользователю обращаешься «сэр» (или по роли, заданной в чате). Отвечай чётко, по делу и без обрывов. Если начинается ролевая игра (РП) — мгновенно подхватывай сюжет и отыгрывай максимально живо.";

  let cfg = JSON.parse(localStorage.getItem("jarvis_ds_cfg_v2")) || {
    url: "https://jarvis-brain.trofimmatvey81.workers.dev",
    key: "123",
    fastModel: "@cf/meta/llama-3.1-8b-instruct-fast",
    prompt: DEFAULT_PROMPT
  };

  let chats = JSON.parse(localStorage.getItem("jarvis_ds_chats_v2")) || [];
  let activeId = null;
  let thinkMode = false;
  let webMode = false;
  let isBusy = false;

  function persist() {
    localStorage.setItem("jarvis_ds_chats_v2", JSON.stringify(chats));
  }

  function startFreshChat() {
    chats = chats.filter(c => c.messages && c.messages.length > 0);
    const id = "chat_" + Date.now();
    chats.unshift({ id: id, title: "Новый чат", pinned: false, messages: [] });
    activeId = id;
    persist();
    renderLists();
    renderChat();
  }

  function toggleDrawer(force) {
    const drawer = document.getElementById("drawer");
    const overlay = document.getElementById("overlay");
    const open = typeof force === "boolean" ? force : !drawer.classList.contains("open");
    drawer.classList.toggle("open", open);
    overlay.classList.toggle("open", open);
    if (open) renderLists();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function formatMd(text) {
    let h = escapeHtml(text);
    h = h.replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>");
    h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
    h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    h = h.replace(/
/g, "<br>");
    return h;
  }

  function renderLists() {
    const q = document.getElementById("chat-search").value.trim().toLowerCase();
    const pinnedBox = document.getElementById("pinned-list");
    const listBox = document.getElementById("chat-list");
    const lblPinned = document.getElementById("lbl-pinned");
    pinnedBox.innerHTML = "";
    listBox.innerHTML = "";

    const validChats = chats.filter(c => c.messages.length > 0 || c.id === activeId);
    const filtered = validChats.filter(c => {
      if (!q) return true;
      if (c.title.toLowerCase().includes(q)) return true;
      return c.messages.some(m => m.content.toLowerCase().includes(q));
    });

    let hasPinned = false;
    filtered.forEach(c => {
      const row = document.createElement("div");
      row.className = "chat-item" + (c.id === activeId ? " active" : "");

      const titleSpan = document.createElement("span");
      titleSpan.className = "chat-title";
      titleSpan.textContent = c.title;
      titleSpan.onclick = function() {
        activeId = c.id;
        renderLists();
        renderChat();
        toggleDrawer(false);
      };

      const acts = document.createElement("div");
      acts.className = "chat-actions";

      const pinBtn = document.createElement("button");
      pinBtn.className = "mini-act";
      pinBtn.textContent = c.pinned ? "★" : "☆";
      pinBtn.onclick = function(e) {
        e.stopPropagation();
        c.pinned = !c.pinned;
        persist();
        renderLists();
      };

      const delBtn = document.createElement("button");
      delBtn.className = "mini-act";
      delBtn.textContent = "✕";
      delBtn.onclick = function(e) {
        e.stopPropagation();
        chats = chats.filter(x => x.id !== c.id);
        if (activeId === c.id) {
          startFreshChat();
        } else {
          persist();
          renderLists();
        }
      };

      acts.appendChild(pinBtn);
      acts.appendChild(delBtn);
      row.appendChild(titleSpan);
      row.appendChild(acts);

      if (c.pinned) {
        hasPinned = true;
        pinnedBox.appendChild(row);
      } else {
        listBox.appendChild(row);
      }
    });

    lblPinned.style.display = hasPinned ? "block" : "none";
  }

  function renderChat() {
    const box = document.getElementById("chat-box");
    const chat = chats.find(c => c.id === activeId);
    if (!chat || chat.messages.length === 0) {
      box.innerHTML =
        '<div class="welcome">' +
          '<div class="welcome-ava"><img src="avatar.png" onerror="this.style.display='none'"><span>J</span></div>' +
          '<h2>Здравствуйте, сэр.<br>Чем могу помочь?</h2>' +
          '<p>Включайте «Рассуждение» для сложных задач или «Поиск» для свежих данных из сети.</p>' +
        '</div>';
      return;
    }

    box.innerHTML = "";
    chat.messages.forEach((m, idx) => {
      const div = document.createElement("div");
      div.className = "msg " + (m.role === "user" ? "user" : "ai");

      if (m.role === "user") {
        const b = document.createElement("div");
        b.className = "bubble";
        b.innerHTML = formatMd(m.content);
        div.appendChild(b);
      } else {
        const head = document.createElement("div");
        head.className = "ai-head";
        head.innerHTML = '<div class="ai-mini-ava"><img src="avatar.png" onerror="this.style.display='none'"><span>J</span></div><span>JARVIS</span>';

        const b = document.createElement("div");
        b.className = "bubble";
        b.innerHTML = formatMd(m.content);

        const bar = document.createElement("div");
        bar.className = "ai-toolbar";

        const copyBtn = document.createElement("button");
        copyBtn.className = "tool-chip";
        copyBtn.textContent = "📋 Копировать";
        copyBtn.onclick = function() {
          navigator.clipboard && navigator.clipboard.writeText(m.content);
          copyBtn.textContent = "✓ Скопировано";
          setTimeout(() => { copyBtn.textContent = "📋 Копировать"; }, 1400);
        };
        bar.appendChild(copyBtn);

        if (idx === chat.messages.length - 1 && !isBusy) {
          const regenBtn = document.createElement("button");
          regenBtn.className = "tool-chip";
          regenBtn.textContent = "↻ Заново";
          regenBtn.onclick = function() { regenerateLast(); };
          bar.appendChild(regenBtn);
        }

        div.appendChild(head);
        div.appendChild(b);
        div.appendChild(bar);
      }
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  }

  async function requestReply(chat) {
    if (isBusy) return;
    isBusy = true;
    document.getElementById("btn-send").disabled = true;

    const box = document.getElementById("chat-box");
    const loadingDiv = document.createElement("div");
    loadingDiv.className = "msg ai";
    loadingDiv.innerHTML =
      '<div class="ai-head"><div class="ai-mini-ava"><img src="avatar.png" onerror="this.style.display='none'"><span>J</span></div><span>JARVIS</span></div>' +
      '<div class="bubble"><div class="typing-dots"><i></i><i></i><i></i></div></div>';
    box.appendChild(loadingDiv);
    box.scrollTop = box.scrollHeight;

    const chosenModel = thinkMode ? "@cf/meta/llama-3.3-70b-instruct-fp8-fast" : cfg.fastModel;
    const history = [{ role: "system", content: cfg.prompt }].concat(chat.messages.slice(-8));

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 25000);

      const res = await fetch(cfg.url.trim(), {
        method: "POST",
        signal: controller.signal,
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + cfg.key.trim()
        },
        body: JSON.stringify({
          model: chosenModel,
          messages: history,
          stream: false,
          webSearch: webMode
        })
      });
      clearTimeout(timeoutId);

      const rawText = await res.text();
      let reply = "";
      try {
        const data = JSON.parse(rawText);
        reply = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || data.response || (data.error && data.error.message) || "";
      } catch (parseErr) {
        reply = rawText;
      }

      if (!reply) reply = "Ответ пришёл пустым, сэр. Попробуйте нажать «↻ Заново».";
      chat.messages.push({ role: "assistant", content: reply });
    } catch (err) {
      const errText = err.name === "AbortError"
        ? "Сервер слишком долго думал, сэр. Попробуйте выключить «Рассуждение» или нажать «↻ Заново»."
        : "Ошибка связи с сервером, сэр: " + err.message;
      chat.messages.push({ role: "assistant", content: errText });
    }

    isBusy = false;
    document.getElementById("btn-send").disabled = false;
    persist();
    renderChat();
  }

  function sendMessage() {
    if (isBusy) return;
    const inp = document.getElementById("msg-input");
    const text = inp.value.trim();
    if (!text) return;

    let chat = chats.find(c => c.id === activeId);
    if (!chat) {
      startFreshChat();
      chat = chats[0];
    }

    if (chat.messages.length === 0) {
      chat.title = text.slice(0, 30) + (text.length > 30 ? "..." : "");
    }

    chat.messages.push({ role: "user", content: text });
    inp.value = "";
    inp.style.height = "24px";
    persist();
    renderLists();
    renderChat();
    requestReply(chat);
  }

  function regenerateLast() {
    if (isBusy) return;
    const chat = chats.find(c => c.id === activeId);
    if (!chat || chat.messages.length < 2) return;
    if (chat.messages[chat.messages.length - 1].role === "assistant") {
      chat.messages.pop();
    }
    persist();
    renderChat();
    requestReply(chat);
  }

  function updatePills() {
    document.getElementById("pill-think").classList.toggle("active", thinkMode);
    document.getElementById("pill-web").classList.toggle("active", webMode);
    const badge = document.getElementById("badge-mode");
    if (thinkMode) {
      badge.textContent = "Pro 70B";
    } else if (cfg.fastModel.includes("coder")) {
      badge.textContent = "Coder 32B";
    } else if (cfg.fastModel.includes("70b")) {
      badge.textContent = "Pro 70B";
    } else {
      badge.textContent = "Turbo 8B";
    }
  }

  document.getElementById("btn-menu").onclick = function() { toggleDrawer(); };
  document.getElementById("overlay").onclick = function() { toggleDrawer(false); };
  document.getElementById("btn-new-top").onclick = function() { startFreshChat(); };
  document.getElementById("btn-new-side").onclick = function() { startFreshChat(); toggleDrawer(false); };
  document.getElementById("chat-search").oninput = function() { renderLists(); };

  document.getElementById("pill-think").onclick = function() {
    thinkMode = !thinkMode;
    updatePills();
  };
  document.getElementById("pill-web").onclick = function() {
    webMode = !webMode;
    updatePills();
  };

  document.getElementById("btn-send").onclick = function() { sendMessage(); };
  const msgInp = document.getElementById("msg-input");
  msgInp.onkeydown = function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  };
  msgInp.oninput = function() {
    this.style.height = "24px";
    this.style.height = Math.min(this.scrollHeight, 120) + "px";
  };

  document.getElementById("btn-settings").onclick = function() {
    toggleDrawer(false);
    document.getElementById("cfg-url").value = cfg.url;
    document.getElementById("cfg-key").value = cfg.key;
    document.getElementById("cfg-fast-model").value = cfg.fastModel;
    document.getElementById("cfg-prompt").value = cfg.prompt;
    document.getElementById("modal-settings").classList.add("open");
  };
  document.getElementById("btn-cfg-cancel").onclick = function() {
    document.getElementById("modal-settings").classList.remove("open");
  };
  document.getElementById("btn-cfg-save").onclick = function() {
    cfg.url = document.getElementById("cfg-url").value.trim() || "https://jarvis-brain.trofimmatvey81.workers.dev";
    cfg.key = document.getElementById("cfg-key").value.trim() || "123";
    cfg.fastModel = document.getElementById("cfg-fast-model").value;
    cfg.prompt = document.getElementById("cfg-prompt").value.trim() || DEFAULT_PROMPT;
    localStorage.setItem("jarvis_ds_cfg_v2", JSON.stringify(cfg));
    updatePills();
    document.getElementById("modal-settings").classList.remove("open");
  };

  updatePills();
  startFreshChat();
</script>
</body>
</html>
