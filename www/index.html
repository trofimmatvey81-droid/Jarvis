<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YARVIS AI</title>
  <style>
    :root {
      --bg: #0f1117;
      --sidebar: #13161f;
      --surface: #1a1e29;
      --border: #282e3d;
      --text: #eceef2;
      --muted: #8b949e;
      --accent: #4d6bfe;
      --accent-soft: rgba(77, 107, 254, 0.16);
      --danger: #e5484d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

    /* Боковая панель в стиле DeepSeek */
    aside {
      width: 260px; background: var(--sidebar); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; transition: transform 0.25s ease; z-index: 50;
    }
    .side-top { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 800; font-size: 18px; letter-spacing: 0.5px; color: #fff; }
    .new-chat-btn {
      margin: 12px 16px; padding: 10px 14px; background: var(--accent-soft); border: 1px solid var(--accent);
      color: #fff; border-radius: 12px; font-weight: 600; cursor: pointer; text-align: left;
    }
    .chat-list { flex: 1; overflow-y: auto; padding: 0 12px; display: flex; flex-direction: column; gap: 4px; }
    .chat-item {
      padding: 10px 12px; border-radius: 10px; font-size: 14px; color: var(--muted);
      cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chat-item.active, .chat-item:hover { background: var(--surface); color: var(--text); }
    .side-bottom { padding: 12px 16px; border-top: 1px solid var(--border); }
    .settings-btn {
      width: 100%; padding: 10px; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: 10px; cursor: pointer; font-size: 14px; text-align: left;
    }

    /* Основная область */
    main { flex: 1; display: flex; flex-direction: column; width: 100%; position: relative; }
    header {
      padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .icon-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 7px 11px; border-radius: 10px; cursor: pointer; font-size: 14px;
    }

    /* Приветственный экран в стиле DeepSeek (без навязчивых аватарок в ленте) */
    #welcome-screen {
      flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; padding: 24px;
    }
    .welcome-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: #fff; }
    .welcome-sub { font-size: 14px; color: var(--muted); max-width: 320px; line-height: 1.5; }

    /* Лента сообщений */
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: none; flex-direction: column; gap: 14px; }
    .msg { max-width: 90%; padding: 12px 16px; border-radius: 16px; line-height: 1.55; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
    .user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg img { max-width: 100%; border-radius: 10px; margin-bottom: 8px; display: block; }

    /* Превью фото перед отправкой */
    #preview-bar {
      display: none; padding: 8px 16px; background: var(--surface); border-top: 1px solid var(--border);
      align-items: center; gap: 10px;
    }
    #preview-img { height: 54px; border-radius: 8px; border: 1px solid var(--border); }

    /* Кнопки режимов DeepSeek */
    .modes { display: flex; gap: 8px; padding: 8px 16px 4px; overflow-x: auto; }
    .chip {
      padding: 6px 12px; border-radius: 20px; font-size: 13px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); cursor: pointer; white-space: nowrap;
    }
    .chip.active { background: var(--accent-soft); border-color: var(--accent); color: #fff; }

    /* Панель ввода */
    .input-box { padding: 8px 16px 14px; display: flex; gap: 8px; align-items: flex-end; }
    textarea {
      flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text);
      border-radius: 16px; padding: 11px 14px; font-size: 15px; resize: none; max-height: 110px; outline: none;
    }
    .round-btn {
      width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-size: 17px; cursor: pointer; flex-shrink: 0;
    }
    .send-btn { background: var(--accent); border: none; color: #fff; }

    /* Модальные окна */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      justify-content: center; align-items: center; padding: 16px; z-index: 100;
    }
    .modal-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 20px; width: 100%; max-width: 420px;
    }
    .modal-card h3 { margin-bottom: 12px; }
    .modal-card label { display: block; font-size: 13px; color: var(--muted); margin-top: 10px; }
    .modal-card input, .modal-card textarea {
      width: 100%; padding: 10px; margin-top: 6px; background: var(--bg);
      border: 1px solid var(--border); color: #fff; border-radius: 10px;
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .btn-primary { flex: 1; padding: 11px; background: var(--accent); border: none; color: #fff; border-radius: 10px; font-weight: 600; cursor: pointer; }
    .btn-sec { flex: 1; padding: 11px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 10px; cursor: pointer; }

    video { width: 100%; border-radius: 12px; background: #000; margin-bottom: 12px; max-height: 300px; object-fit: cover; }

    @media (max-width: 768px) {
      aside { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); }
      aside.open { transform: translateX(0); }
    }
  </style>
</head>
<body>

  <aside id="sidebar">
    <div class="side-top">
      <span class="brand">YARVIS AI</span>
      <button type="button" class="icon-btn" id="btn-close-side">✕</button>
    </div>
    <button type="button" class="new-chat-btn" id="btn-new-chat">＋ Новый чат</button>
    <div class="chat-list" id="chat-list"></div>
    <div class="side-bottom">
      <button type="button" class="settings-btn" id="btn-open-settings">⚙ Настройки YARVIS</button>
    </div>
  </aside>

  <main>
    <header>
      <div style="display:flex; align-items:center; gap:10px;">
        <button type="button" class="icon-btn" id="btn-menu">☰</button>
        <span style="font-weight:700;">YARVIS</span>
      </div>
      <div style="display:flex; gap:8px;">
        <button type="button" class="icon-btn" id="btn-tts" title="Озвучка ответов">🔊</button>
        <button type="button" class="icon-btn" id="btn-live">📹 Эфир</button>
      </div>
    </header>

    <div id="welcome-screen">
      <div class="welcome-title">Чем могу помочь?</div>
      <div class="welcome-sub">Задайте вопрос, покажите обстановку через камеру или начните ролевую игру — я подстроюсь автоматически.</div>
    </div>

    <div id="chat"></div>

    <div id="preview-bar">
      <img id="preview-img" src="" alt="Фото">
      <span style="font-size:13px; color:var(--muted); flex:1;">Фото готово к отправке</span>
      <button type="button" class="icon-btn" id="btn-clear-img">✕</button>
    </div>

    <div class="modes">
      <button type="button" class="chip" id="btn-think">⚛ Рассуждение</button>
      <button type="button" class="chip active" id="btn-web">🌐 Поиск</button>
    </div>

    <div class="input-box">
      <button type="button" class="round-btn" id="btn-cam" title="Сделать фото">📷</button>
      <input type="file" id="file-input" accept="image/*" capture="environment" style="display:none">
      <button type="button" class="round-btn" id="mic-btn" title="Голосовой ввод">🎤</button>
      <textarea id="prompt" rows="1" placeholder="Напишите или начните РП-сцену..."></textarea>
      <button type="button" class="round-btn send-btn" id="btn-send">↑</button>
    </div>
  </main>

  <div class="modal" id="settings-modal">
    <div class="modal-card">
      <h3>Настройки YARVIS</h3>
      <label>Адрес сервера (Cloudflare Worker)</label>
      <input type="text" id="worker-url" placeholder="https://jarvis-brain.workers.dev">
      <label>Дополнительные инструкции</label>
      <textarea id="system-prompt" rows="4" placeholder="Свои пожелания к стилю YARVIS..."></textarea>
      <div class="modal-actions">
        <button type="button" class="btn-sec" id="btn-cancel-settings">Отмена</button>
        <button type="button" class="btn-primary" id="btn-save-settings">Сохранить</button>
      </div>
    </div>
  </div>

  <div class="modal" id="camera-modal">
    <div class="modal-card">
      <h3 id="cam-title">📹 Камера YARVIS</h3>
      <video id="video-feed" autoplay playsinline></video>
      <canvas id="snap-canvas" style="display:none;"></canvas>
      <p id="live-status" style="font-size:13px; color:var(--muted); margin-bottom:12px;">Наведите камеру на объект или обстановку.</p>
      <div class="modal-actions">
        <button type="button" class="btn-sec" id="btn-close-cam">Закрыть</button>
        <button type="button" class="btn-primary" id="cam-action-btn">Показать Ярвису</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
