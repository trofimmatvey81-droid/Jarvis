<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JARVIS AI</title>
<style>
  :root {
    --bg: #141416;
    --sidebar: #1a1b1e;
    --card: #222327;
    --card-hover: #2b2d32;
    --border: rgba(255, 255, 255, 0.08);
    --blue: #4d6bfe;
    --blue-soft: rgba(77, 107, 254, 0.16);
    --text: #ececf1;
    --muted: #8e8ea0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--bg); z-index: 10;
  }
  .icon-btn {
    background: none; border: none; color: var(--text); width: 38px; height: 38px;
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 20px;
  }
  .icon-btn:active { background: var(--card); }
  .header-title { font-size: 15px; font-weight: 600; color: var(--text); max-width: 210px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .header-right { display: flex; align-items: center; gap: 4px; }

  /* Боковая шторка как в DeepSeek */
  .overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 40;
    display: none; opacity: 0; transition: opacity 0.2s;
  }
  .overlay.open { display: block; opacity: 1; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: 295px; max-width: 84vw;
    background: var(--sidebar); z-index: 50; transform: translateX(-100%);
    transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    display: flex; flex-direction: column; padding: 14px 12px;
  }
  .sidebar.open { transform: translateX(0); }
  .search-wrap {
    background: var(--card); border-radius: 20px; padding: 9px 14px;
    display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
  }
  .search-wrap input {
    background: none; border: none; color: var(--text); font-size: 14px;
    width: 100%; outline: none;
  }
  .search-wrap input::placeholder { color: var(--muted); }
  .chats-scroll { flex: 1; overflow-y: auto; padding-right: 2px; }
  .section-lbl {
    font-size: 12px; color: var(--muted); font-weight: 500;
    padding: 10px 10px 6px; display: flex; align-items: center; justify-content: space-between;
  }
  .chat-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 12px; border-radius: 12px; cursor: pointer;
    font-size: 14.5px; color: var(--text); margin-bottom: 2px;
  }
  .chat-row.active { background: var(--card); font-weight: 600; }
  .chat-row:active { background: var(--card-hover); }
  .chat-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 8px; }
  .chat-actions { display: flex; align-items: center; gap: 4px; }
  .mini-act {
    background: none; border: none; color: var(--muted); font-size: 14px;
    padding: 4px 6px; border-radius: 6px; cursor: pointer;
  }
  .mini-act.pinned { color: var(--blue); }

  .sidebar-footer {
    border-top: 1px solid var(--border); padding-top: 12px; margin-top: 8px;
    display: flex; align-items: center; justify-content: space-between; padding-left: 6px; padding-right: 6px;
  }
  .user-profile { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .user-ava {
    width: 34px; height: 34px; border-radius: 50%; background: var(--blue);
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    font-size: 14px; color: #fff; overflow: hidden; position: relative;
  }
  .user-ava img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  .user-name { font-size: 15px; font-weight: 600; color: var(--text); }

  /* Главный экран и сообщения */
  #chat-box { flex: 1; overflow-y: auto; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 18px; }
  .welcome {
    margin: auto; text-align: center; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 20px;
  }
  .center-logo {
    width: 64px; height: 64px; border-radius: 50%; margin-bottom: 16px;
    background: var(--blue-soft); border: 2px solid var(--blue);
    display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
  }
  .center-logo img { width: 100%; height: 100%; object-fit: cover; object-position: top center; position: relative; z-index: 2; }
  .center-logo span { font-size: 26px; font-weight: 800; color: var(--blue); position: absolute; z-index: 1; }
  .welcome h2 { font-size: 21px; font-weight: 600; line-height: 1.35; color: var(--text); }

  .msg { display: flex; flex-direction: column; max-width: 100%; animation: fade 0.15s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; max-width: 84%; }
  .msg.user .bubble {
    background: #2b2d33; color: var(--text); padding: 11px 15px;
    border-radius: 18px; border-bottom-right-radius: 4px; font-size: 15px; line-height: 1.48;
  }
  .msg.ai { align-self: flex-start; width: 100%; flex-direction: row; gap: 10px; }
  .ai-ava {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--card); flex-shrink: 0; overflow: hidden; position: relative;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--blue); margin-top: 2px;
  }
  .ai-ava img { width: 100%; height: 100%; object-fit: cover; object-position: top center; position: relative; z-index: 2; }
  .ai-ava span { position: absolute; z-index: 1; }
  .msg.ai .bubble { flex: 1; font-size: 15.5px; line-height: 1.6; color: var(--text); word-wrap: break-word; }
  .bubble pre {
    background: #0d0e10; border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; margin: 10px 0; overflow-x: auto; font-family: monospace; font-size: 13px; color: #8be9fd;
  }
  .bubble code { background: rgba(255,255,255,0.08); padding: 2px 5px; border-radius: 4px; font-family: monospace; font-size: 13.5px; }
  .bubble pre code { background: none; padding: 0; }

  /* Нижняя капсула ввода как в DeepSeek */
  .composer-wrap { padding: 8px 12px 14px; background: var(--bg); }
  .composer {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 22px; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px;
  }
  .composer textarea {
    width: 100%; background: none; border: none; color: var(--text);
    font-size: 15.5px; line-height: 1.4; resize: none; outline: none;
    min-height: 26px; max-height: 130px; padding: 2px 4px;
  }
  .composer textarea::placeholder { color: var(--muted); }
  .composer-bar { display: flex; align-items: center; justify-content: space-between; }
  .pills { display: flex; align-items: center; gap: 8px; }
  .pill {
    display: flex; align-items: center; gap: 6px; padding: 6px 12px;
    border-radius: 16px; border: 1px solid var(--border); background: transparent;
    color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .pill.active {
    background: var(--blue-soft); border-color: rgba(77, 107, 254, 0.5); color: #829bff;
  }
  .right-tools { display: flex; align-items: center; gap: 8px; }
  .send-circle {
    width: 34px; height: 34px; border-radius: 50%; border: none;
    background: var(--blue); color: #fff; font-size: 16px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .send-circle:disabled { background: #34363d; color: var(--muted); }

  /* Модалка настроек */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 60;
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .modal.open { display: flex; }
  .modal-box {
    background: var(--sidebar); border: 1px solid var(--border); border-radius: 20px;
    width: 100%; max-width: 390px; padding: 18px; max-height: 88vh; overflow-y: auto;
  }
  .modal-box h3 { font-size: 17px; margin-bottom: 14px; }
  .fld { margin-bottom: 12px; }
  .fld label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .fld input, .fld textarea {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text); padding: 10px 12px; font-size: 14px; outline: none;
  }
  .m-btns { display: flex; gap: 10px; margin-top: 14px; }
  .m-btn { flex: 1; padding: 11px; border-radius: 12px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; }
  .m-cancel { background: var(--card); color: var(--muted); }
  .m-save { background: var(--blue); color: #fff; }
</style>
</head>
<body>

<header>
  <button class="icon-btn" onclick="toggleSidebar()" title="История чатов">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="16" x2="14" y2="16"/></svg>
  </button>
  <div class="header-title" id="top-title">JARVIS</div>
  <div class="header-right">
    <button class="icon-btn" onclick="openSettings()" title="Настройки">⚙</button>
    <button class="icon-btn" onclick="newChat()" title="Новый чат">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    </button>
  </div>
</header>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
<aside class="sidebar" id="sidebar">
  <div class="search-wrap">
    <span style="color:var(--muted)">🔍</span>
    <input type="text" id="chat-search" placeholder="Поиск по содержимому чата..." oninput="renderSidebar()">
  </div>
  <div class="chats-scroll" id="chats-scroll"></div>
  <div class="sidebar-footer">
    <div class="user-profile" onclick="openSettings()">
      <div class="user-ava">
        <img src="avatar.png" onerror="this.style.display='none'" alt="">
        <span>M</span>
      </div>
      <span class="user-name" id="profile-name">Matvey</span>
    </div>
    <button class="icon-btn" onclick="openSettings()">•••</button>
  </div>
</aside>

<main id="chat-box"></main>

<div class="composer-wrap">
  <div class="composer">
    <textarea id="prompt-input" rows="1" placeholder="Напишите сообщение Джарвису..." onkeydown="onKey(event)" oninput="autoGrow(this)"></textarea>
    <div class="composer-bar">
      <div class="pills">
        <button class="pill active" id="pill-pro" onclick="togglePro()">
          <span>⚛</span> <span id="pro-label">Рассуждение</span>
        </button>
        <button class="pill active" id="pill-web" onclick="toggleWeb()">
          <span>🌐</span> <span>Поиск</span>
        </button>
      </div>
      <div class="right-tools">
        <button class="send-circle" id="send-btn" onclick="send()">↑</button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="settings-modal">
  <div class="modal-box">
    <h3>Настройки JARVIS</h3>
    <div class="fld">
      <label>Твоё имя в профиле:</label>
      <input type="text" id="s-user" value="Matvey">
    </div>
    <div class="fld">
      <label>Адрес сервера (Cloudflare Worker):</label>
      <input type="text" id="s-url">
    </div>
    <div class="fld">
      <label>Ключ доступа:</label>
      <input type="password" id="s-key">
    </div>
    <div class="fld">
      <label>Характер, обращение «сэр» и сценарий РП:</label>
      <textarea id="s-prompt" rows="4"></textarea>
    </div>
    <div class="m-btns">
      <button class="m-btn m-cancel" onclick="closeSettings()">Отмена</button>
      <button class="m-btn m-save" onclick="saveSettings()">Сохранить</button>
    </div>
  </div>
</div>

<script>
  const DEFAULT_SYS = "Ты — ДЖАРВИС (J.A.R.V.I.S.), высокоинтеллектуальный ИИ-ассистент с харизмой и лёгкой британской иронией. Твой создатель и архитектор — Матвей. К пользователю ты обращаешься «сэр» (или по любому имени и роли, которые пользователь задаст в чате). Если начинается ролевая игра (РП) или задаётся новый персонаж, ты мгновенно вживаешься в роль, подхватываешь сюжет и отыгрываешь его живо и атмосферно без занудства и морализаторства.";

  let cfg = JSON.parse(localStorage.getItem('ds_jarvis_cfg')) || {
    userName: 'Matvey',
    url: 'https://jarvis-brain.trofimmatvey81.workers.dev',
    key: '123',
    sys: DEFAULT_SYS,
    proMode: true,
    webMode: true
  };

  let chats = JSON.parse(localStorage.getItem('ds_jarvis_chats')) || [];
  let curId = localStorage.getItem('ds_jarvis_cur') || null;

  function persist() {
    localStorage.setItem('ds_jarvis_cfg', JSON.stringify(cfg));
    localStorage.setItem('ds_jarvis_chats', JSON.stringify(chats));
    localStorage.setItem('ds_jarvis_cur', curId);
  }

  function syncPills() {
    document.getElementById('pill-pro').classList.toggle('active', cfg.proMode);
    document.getElementById('pro-label').textContent = cfg.proMode ? 'Рассуждение' : 'Турбо';
    document.getElementById('pill-web').classList.toggle('active', cfg.webMode);
    document.getElementById('profile-name').textContent = cfg.userName || 'Matvey';
  }

  function togglePro() { cfg.proMode = !cfg.proMode; persist(); syncPills(); }
  function toggleWeb() { cfg.webMode = !cfg.webMode; persist(); syncPills(); }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('open');
    renderSidebar();
  }

  function newChat() {
    const id = 'c_' + Date.now();
    chats.unshift({ id, title: 'Новый чат', pinned: false, messages: [] });
    curId = id;
    persist();
    renderSidebar();
    renderChat();
    if (document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
  }

  function selectChat(id) {
    curId = id;
    persist();
    renderChat();
    toggleSidebar();
  }

  function togglePin(e, id) {
    e.stopPropagation();
    const c = chats.find(x => x.id === id);
    if (c) c.pinned = !c.pinned;
    persist();
    renderSidebar();
  }

  function removeChat(e, id) {
    e.stopPropagation();
    chats = chats.filter(x => x.id !== id);
    if (curId === id) curId = chats.length ? chats.at(0).id : null;
    if (!curId) newChat();
    else { persist(); renderSidebar(); renderChat(); }
  }

  function renderSidebar() {
    const q = (document.getElementById('chat-search').value || '').toLowerCase();
    const box = document.getElementById('chats-scroll');
    box.innerHTML = '';

    const filtered = chats.filter(c =>
      c.title.toLowerCase().includes(q) ||
      c.messages.some(m => m.content.toLowerCase().includes(q))
    );

    const pinned = filtered.filter(c => c.pinned);
    const regular = filtered.filter(c => !c.pinned);

    if (pinned.length) {
      box.innerHTML += `<div class="section-lbl"><span>Закреплено</span></div>`;
      pinned.forEach(c => box.appendChild(makeChatRow(c)));
    }
    if (regular.length) {
      box.innerHTML += `<div class="section-lbl"><span>Сегодня и ранее</span></div>`;
      regular.forEach(c => box.appendChild(makeChatRow(c)));
    }
  }

  function makeChatRow(c) {
    const row = document.createElement('div');
    row.className = 'chat-row' + (c.id === curId ? ' active' : '');
    row.onclick = () => selectChat(c.id);
    row.innerHTML = `
      <span class="chat-name">${esc(c.title)}</span>
      <div class="chat-actions">
        <button class="mini-act ${c.pinned ? 'pinned' : ''}" onclick="togglePin(event, '${c.id}')" title="Закрепить">📌</button>
        <button class="mini-act" onclick="removeChat(event, '${c.id}')" title="Удалить">✕</button>
      </div>`;
    return row;
  }

  function esc(s) {
    return s.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }

  function md(t) {
    let s = esc(t);
    s = s.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\n/g, '<br>');
    return s;
  }

  function renderChat() {
    const box = document.getElementById('chat-box');
    const c = chats.find(x => x.id === curId);
    document.getElementById('top-title').textContent = (c && c.messages.length) ? c.title : 'JARVIS';

    if (!c || !c.messages.length) {
      box.innerHTML = `
        <div class="welcome">
          <div class="center-logo">
            <img src="avatar.png" onerror="this.style.display='none'" alt="">
            <span>J</span>
          </div>
          <h2>Здравствуйте, сэр.<br>Чем могу помочь?</h2>
        </div>`;
      return;
    }

    box.innerHTML = '';
    c.messages.forEach(m => {
      const div = document.createElement('div');
      div.className = 'msg ' + (m.role === 'user' ? 'user' : 'ai');
      if (m.role === 'assistant') {
        div.innerHTML = `<div class="ai-ava"><img src="avatar.png" onerror="this.style.display='none'"><span>J</span></div><div class="bubble">${md(m.content)}</div>`;
      } else {
        div.innerHTML = `<div class="bubble">${md(m.content)}</div>`;
      }
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  }

  async function send() {
    const inp = document.getElementById('prompt-input');
    const text = inp.value.trim();
    if (!text) return;

    let c = chats.find(x => x.id === curId);
    if (!c) { newChat(); c = chats.at(0); }
    if (!c.messages.length) {
      c.title = text.slice(0, 30) + (text.length > 30 ? '...' : '');
    }

    c.messages.push({ role: 'user', content: text });
    inp.value = '';
    inp.style.height = '26px';
    persist();
    renderChat();

    const btn = document.getElementById('send-btn');
    btn.disabled = true;

    const box = document.getElementById('chat-box');
    const aiDiv = document.createElement('div');
    aiDiv.className = 'msg ai';
    aiDiv.innerHTML = `<div class="ai-ava"><img src="avatar.png" onerror="this.style.display='none'"><span>J</span></div><div class="bubble" style="color:var(--muted)">●</div>`;
    box.appendChild(aiDiv);
    const bubble = aiDiv.querySelector('.bubble');
    box.scrollTop = box.scrollHeight;

    const model = cfg.proMode
      ? '@cf/meta/llama-3.3-70b-instruct-fp8-fast'
      : '@cf/meta/llama-3.1-8b-instruct-fast';

    const queryToSend = cfg.webMode ? text : text.replace(/\?/g, '');
    const hist = [{ role: 'system', content: cfg.sys }, ...c.messages.slice(-8)];
    hist[hist.length - 1] = { role: 'user', content: queryToSend };

    let reply = '';
    try {
      const res = await fetch(cfg.url.trim(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key.trim() },
        body: JSON.stringify({ model, messages: hist, stream: true })
      });

      const reader = res.body.getReader();
      const dec = new TextDecoder();
      bubble.style.color = 'var(--text)';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const lines = dec.decode(value, { stream: true }).split('\n');
        for (const line of lines) {
          if (line.startsWith('data: ') && line !== 'data: [DONE]') {
            try {
              const j = JSON.parse(line.slice(6));
              if (j.response) {
                reply += j.response;
                bubble.innerHTML = md(reply);
                box.scrollTop = box.scrollHeight;
              }
            } catch (e) {}
          }
        }
      }
      if (!reply) reply = 'Готово, сэр.';
      c.messages.push({ role: 'assistant', content: reply });
    } catch (err) {
      c.messages.push({ role: 'assistant', content: 'Сбой соединения, сэр: ' + err.message });
    }

    btn.disabled = false;
    persist();
    renderChat();
  }

  function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }
  function autoGrow(el) {
    el.style.height = '26px';
    el.style.height = Math.min(el.scrollHeight, 130) + 'px';
  }

  function openSettings() {
    document.getElementById('s-user').value = cfg.userName || 'Matvey';
    document.getElementById('s-url').value = cfg.url;
    document.getElementById('s-key').value = cfg.key;
    document.getElementById('s-prompt').value = cfg.sys;
    document.getElementById('settings-modal').classList.add('open');
  }
  function closeSettings() { document.getElementById('settings-modal').classList.remove('open'); }
  function saveSettings() {
    cfg.userName = document.getElementById('s-user').value.trim() || 'Matvey';
    cfg.url = document.getElementById('s-url').value.trim();
    cfg.key = document.getElementById('s-key').value.trim();
    cfg.sys = document.getElementById('s-prompt').value.trim() || DEFAULT_SYS;
    persist();
    syncPills();
    closeSettings();
  }

  syncPills();
  if (!chats.length) newChat();
  else renderChat();
</script>
</body>
</html>
